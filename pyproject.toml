[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-ch-wsn-v2"
version = "2.0.0"
description = "Wireless sensor network clustering with fuzzy inference and Grey Wolf Optimization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["wsn_gwo_v2*"]

